# see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning.

name: "Code SAST"

on:
  push:
    branches: [ "hardened" ]
  pull_request:
    branches: [ "hardened" ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
  schedule:
    - cron: '0 6 * * 3'
  workflow_dispatch: {} # Allows manual triggering of the workflow from the GitHub Actions tab in the repository.

jobs:
  # ── SAST: C/C++ via CodeQL
  analyze:
    name: CodeQL Analysis for C/C++ and GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
        - language: actions  # GitHub Actions workflows

    steps:
    # Checkout the respository to be analyzed into the Actions runner.
    # The CodeQL Action will automatically add the "codeql" user as a collaborator with read access to the repository when it runs.
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: "recursive" # to ensure that the "common/lib*/" directories are included in the checkout, as they are required for the build and analysis steps.
    
    # This step is required for compiled languages. Prerequisite for the Build step.
    # For more details, see: https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages#installing-build-dependencies
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make

    # Initialize CodeQL: define the languages to be analyzed and specify any additional queries or packs to be used.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        queries: security-and-quality # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # Add excluded paths (optional)
        # config: |
        #     paths-ignore:
        #       - '**/test/**'

    # Build project for CodeQL analysis of compiled languages
    # See https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
    - name: Build
      run: |
        make -C aircast CC=gcc HOST=linux PLATFORM=x86_64 -j$(nproc)

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
        upload: true  # Upload results to GitHub Code Scanning (instead of only seeing the results in the Actions logs)
      id: analyze # ID needed to reference the outputs of this step in the subsequent artifact upload step.

    # Upload the SARIF file generated by the CodeQL analysis as an artifact that can be downloaded from the Actions tab in the repository.
    # This is useful for manual runs of the workflow, where results are not automatically uploaded to GitHub Code Scanning.
    - name: Upload artifact of CodeQL results
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: codeql-results
        path: ${{ steps.analyze.outputs.sarif-output }}
        retention-days: 5

  # ── SAST: Bash-specific via ShellCheck (GitHub Marketplace action: https://github.com/ludeeus/action-shellcheck) ──
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        id: shellcheck
        continue-on-error: true     # Keep job alive so upload step runs (otherwise it fails the step and pipeline if there are findings)